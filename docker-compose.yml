version: '3.8'

services:
  # Shadowsocks Proxy Server
  proxy:
    build:
      context: ./shadowsocks-proxy
      dockerfile: Dockerfile
    container_name: shadowsocks-proxy
    restart: always
    stop_grace_period: 30s
    ports:
      - "1080:1080"
    environment:
      # Proxy configuration
      - PROXY_HOST=0.0.0.0
      - PROXY_PORT=1080
      - PROXY_PROTOCOL=shadowsocks
      # Shadowsocks master secret for password generation
      - SS_MASTER_SECRET=${SS_MASTER_SECRET}
      # Optional: specify username (default is 'default_user')
      - SS_USERNAME=${SS_USERNAME:-default_user}
      # Bot configuration (optional)
      - BOT_TOKEN=${BOT_TOKEN:-}
      - SS_METHOD=${SS_METHOD:-chacha20-ietf-poly1305}
      - ADMIN_IDS=${ADMIN_IDS:-}
    networks:
      - proxy-network
    # Security: read-only filesystem
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,nodev,size=100m
    # TCP optimization
    sysctls:
      - net.ipv4.tcp_keepalive_time=600
      - net.ipv4.tcp_keepalive_intvl=60
      - net.ipv4.tcp_keepalive_probes=3
      - net.core.somaxconn=1024
    # Capabilities
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 128M
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "2"

networks:
  proxy-network:
    driver: bridge
