version: '3.8'

services:
  # Shadowsocks Proxy Server
  proxy:
    build:
      context: ./shadowsocks-proxy
      dockerfile: Dockerfile
    container_name: shadowsocks-proxy
    restart: always
    stop_grace_period: 30s
    ports:
      - "1080:1080"
    environment:
      - BOT_TOKEN=${BOT_TOKEN:-}
      - ADMIN_IDS=${ADMIN_IDS:-}
      - OUTLINE_API_URL=${OUTLINE_API_URL:-}
    networks:
      - proxy-network
    # Security: read-only filesystem
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,nodev,size=100m
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 128M
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "2"

networks:
  proxy-network:
    driver: bridge
